[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cctvlog"
version = "0.1.0"
description = "CCTV-Log: HDR 합성 대응 Log 보관 스트림 — 실험 관리·파라미터 계산·분석 (순수 Python)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests/py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests/py", "experiments", "capture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
